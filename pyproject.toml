[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adacore"
version = "0.2.0"
description = "AdaCore - Personal AI Assistant"
requires-python = ">=3.14"

dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn",
    "sqlalchemy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
include = ["app*"]